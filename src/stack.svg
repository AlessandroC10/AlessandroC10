<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 440" width="610" height="440" role="img">
<title>Stack de Alessandro Conte: Claude Code, MCP, RAG, Python, TypeScript, Next.js, FastAPI, PostgreSQL, Firebase, n8n, Docker, Playwright, Git, Make y Coolify</title>
<defs>
<linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141A22"/><stop offset="1" stop-color="#0B1016"/></linearGradient>
<radialGradient id="nucleo"><stop offset="0" stop-color="#EAF4FF"/><stop offset=".22" stop-color="#9BE8FF" stop-opacity=".75"/><stop offset="1" stop-color="#3C78A4" stop-opacity="0"/></radialGradient>
<clipPath id="marco"><rect width="610" height="440" rx="20"/></clipPath>
{{SIMBOLOS}}
</defs>
<style>
{{FONTS}}
.anillo{fill:none;stroke:#9BE8FF;stroke-opacity:.5;stroke-dasharray:2 7}
.sat{fill:#9BE8FF;filter:drop-shadow(0 0 4px #9BE8FF)}
.pastilla rect{fill:#1A232D;stroke:#7DA9D0;stroke-opacity:.5}
.pastilla text{font:500 20px 'Archivo',sans-serif;fill:#DEEDEC;text-anchor:middle;dominant-baseline:central}
.logo{fill:#EAF4FF}
.giro{animation:giro linear infinite;transform-box:view-box;transform-origin:305px 220px}
@keyframes giro{to{transform:rotate(360deg)}}
.pulso{transform-box:fill-box;transform-origin:center;animation:pulso 4.5s ease-in-out infinite}
@keyframes pulso{0%,100%{transform:scale(.92);opacity:.8}50%{transform:scale(1.1);opacity:1}}
{{CSS}}
@media (prefers-reduced-motion:reduce){.giro,.pulso{animation:none}}
</style>
<g clip-path="url(#marco)">
<rect width="610" height="440" fill="url(#fondo)"/>
<circle class="pulso" cx="305" cy="220" r="70" fill="url(#nucleo)"/>
{{ANILLOS}}
</g>
<rect x=".5" y=".5" width="609" height="439" rx="20" fill="none" stroke="#fff" stroke-opacity=".14"/>
</svg>

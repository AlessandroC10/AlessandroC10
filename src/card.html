<!doctype html>
<html lang="es"><meta charset="utf-8">
<style>
{{FONTS}}
{{TOKENS}}
*{box-sizing:border-box;margin:0}
html,body{width:830px;height:{{ALTO}}px;background:var(--abismo)}
body{position:relative;overflow:hidden;font-family:'Archivo',sans-serif;color:var(--nieve)}
.fondo{position:absolute;inset:0;background:
  radial-gradient(520px 260px at 92% -20%,rgba(60,120,164,.55),transparent 70%),
  radial-gradient(420px 220px at -5% 120%,rgba(90,146,188,.28),transparent 70%),
  linear-gradient(135deg,var(--roca),var(--abismo))}
.lamina{position:absolute;inset:14px;border-radius:18px;background:var(--glass-alta);
  border:1px solid var(--borde-glass);box-shadow:inset 0 1px 0 var(--filo);
  backdrop-filter:var(--desenfoque);padding:24px 32px;display:flex;flex-direction:column;gap:16px}
.cab{display:flex;align-items:baseline;gap:18px}
.n{font:500 18px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--arco)}
h2{font:italic 500 44px/1 'Bodoni Moda',serif;color:var(--destello)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.col p{font-size:22px;line-height:1.32;font-weight:400}
.col span{display:block;font:500 18px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--cristal-3);margin-bottom:6px}
.es p{color:var(--escarcha)}
</style>
<div class="fondo"></div>
<section class="lamina">
  <div class="cab"><span class="n">{{ETIQUETA}}</span><h2>{{TITULO}}</h2></div>
  <div class="cols">
    <div class="col"><span>EN</span><p>{{EN}}</p></div>
    <div class="col es"><span>ES</span><p>{{ES}}</p></div>
  </div>
</section>

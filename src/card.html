<!doctype html>
<html lang="es"><meta charset="utf-8">
<style>
{{FONTS}}
{{TOKENS}}
*{box-sizing:border-box;margin:0}
html,body{width:{{ANCHO}}px;height:{{ALTO}}px;background:var(--abismo)}
body{position:relative;overflow:hidden;font-family:'Archivo',sans-serif;color:var(--nieve)}
.tarjeta{position:absolute;inset:10px;display:flex;border-radius:20px;overflow:hidden;border:1px solid var(--borde-glass);
  background:
    linear-gradient(115deg,transparent 58%,rgba(125,169,208,.07) 58%,rgba(125,169,208,.07) 72%,transparent 72%),
    linear-gradient(135deg,var(--roca),var(--abismo) 75%)}
.der{flex-direction:row-reverse}
/* Un fotograma del túnel cortado por una arista de cristal; el filo cian marca el corte. */
.foto{flex:0 0 150px;background:#9CC0E0 url({{FOTO}}) center/cover;background-blend-mode:multiply}
.izq .foto{clip-path:polygon(0 0,100% 0,78% 100%,0 100%)}
.der .foto{clip-path:polygon(22% 0,100% 0,100% 100%,0 100%)}
.filo{position:absolute;top:0;height:100%;width:150px;overflow:visible;filter:drop-shadow(0 0 5px rgba(155,232,255,.85))}
.izq .filo{left:0}
.der .filo{right:0}
.izq .l-der,.der .l-izq{display:none}
.texto{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px 24px 20px 14px}
.der .texto{padding:20px 14px 20px 24px}
h2{font:italic 500 56px/1 'Bodoni Moda',serif;letter-spacing:-.01em;color:var(--destello)}
.sep{height:1px;background:linear-gradient(90deg,var(--filo),transparent)}
p{font-size:22px;line-height:1.32}
.en{font-weight:500;color:var(--nieve)}
.es{color:var(--escarcha);opacity:.8}
</style>
<section class="tarjeta {{LADO}}">
  <div class="foto"></div>
  <svg class="filo" viewBox="0 0 150 100" preserveAspectRatio="none">
    <line class="l-izq" x1="150" y1="0" x2="117" y2="100" stroke="#9BE8FF" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    <line class="l-der" x1="33" y1="0" x2="0" y2="100" stroke="#9BE8FF" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="texto">
    <h2>{{TITULO}}</h2>
    <p class="en">{{EN}}</p>
    <div class="sep"></div>
    <p class="es">{{ES}}</p>
  </div>
</section>
